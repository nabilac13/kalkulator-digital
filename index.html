<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Ilmiah Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="kalkulator">
      <div class="bar-atas">
        <button id="tombol-riwayat" class="tombol-ikon" onclick="toggleRiwayat()" aria-label="Riwayat">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
        </button>
      </div>

      <input type="text" id="layar" disabled>

      <div class="tombol-grid">
        <!-- Ilmiah -->
        <button onclick="hitungIlmiah('sin')" class="tombol-ilmiah">sin</button>
        <button onclick="hitungIlmiah('cos')" class="tombol-ilmiah">cos</button>
        <button onclick="hitungIlmiah('tan')" class="tombol-ilmiah">tan</button>
        <button onclick="hitungIlmiah('sqrt')" class="tombol-ilmiah">√</button>

        <!-- Dasar -->
        <button onclick="bersihkanLayar()" class="tombol-spesial">C</button>
        <button onclick="masukkanNilai('/')" class="tombol-operator">/</button>
        <button onclick="masukkanNilai('*')" class="tombol-operator">x</button>
        <button onclick="hapusSatu()" class="tombol-spesial">DEL</button>

        <button onclick="masukkanNilai('7')">7</button>
        <button onclick="masukkanNilai('8')">8</button>
        <button onclick="masukkanNilai('9')">9</button>
        <button onclick="masukkanNilai('-')" class="tombol-operator">-</button>

        <button onclick="masukkanNilai('4')">4</button>
        <button onclick="masukkanNilai('5')">5</button>
        <button onclick="masukkanNilai('6')">6</button>
        <button onclick="masukkanNilai('+')" class="tombol-operator">+</button>

        <button onclick="masukkanNilai('1')">1</button>
        <button onclick="masukkanNilai('2')">2</button>
        <button onclick="masukkanNilai('3')">3</button>
        <button onclick="hitungHasil()" class="tombol-sama-dengan">=</button>

        <button onclick="masukkanNilai('0')" class="tombol-nol">0</button>
        <button onclick="masukkanNilai('.')">.</button>
      </div>
    </div>

    <div class="panel-riwayat">
      <h3>Riwayat (Max 5)</h3>
      <ul id="daftar-riwayat"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
